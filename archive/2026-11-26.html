<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALAMOLAD 日用品推荐</title><style>
:root{--paper:#f7f6f0;--green:#123d2c;--green2:#173d2b;--lime:#d9f26c;--red:#e94e31;--sage:#718074;--sage-soft:#e7efe4;--ink:#1d2b23;--line:#e3e1d5;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;}
button,select{font-family:inherit;cursor:pointer;}
a{text-decoration:none;}
img{display:block;max-width:100%;}
.sc{background:#fff;color:var(--ink);}
.sc .brandbar{background:#fff;padding:18px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.sc .brandname{font-size:25px;color:#1e4d38;font-weight:900;letter-spacing:-.02em;}
.sc .brandname .dot{color:var(--red);}
.sc .brandsub{font-size:13.5px;font-weight:600;color:#7d927f;}
.sc .brandbar .sp{flex:1;}
.langswitch{display:flex;border:1.5px solid #1e4d38;border-radius:999px;overflow:hidden;}
.langswitch button{min-height:40px;padding:8px 16px;border:0;background:#fff;color:#1e4d38;font-size:14px;font-weight:700;}
.langswitch button[aria-pressed="true"]{background:#1e4d38;color:#fff;}
.mall-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 26px;border-radius:999px;font-size:16px;font-weight:800;border:0;background:#1e4d38;color:#fff;}
.sc .hero{margin:6px 22px 0;background:var(--sage-soft);border-radius:28px;padding:48px 42px;display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center;}
.sc .hero h1{font-size:clamp(38px,4.6vw,60px);line-height:1.1;letter-spacing:-.03em;margin:0;color:#1e4d38;font-weight:900;}
.sc .hero h1 em{font-style:normal;box-shadow:inset 0 -0.32em 0 var(--lime);}
.sc .hero p{font-size:16.5px;line-height:1.65;color:#4c6653;margin:18px 0 24px;max-width:30em;}
.sc .hero.mall-btn{background:#1e4d38;color:#fff;min-height:52px;padding:12px 32px;font-size:17px;}
.sc .hero-img{border-radius:22px;overflow:hidden;aspect-ratio:1/1;max-height:400px;width:100%;}
.sc .hero-img img{width:100%;height:100%;object-fit:cover;}
.sc .main{max-width:1300px;margin:0 auto;padding:32px 22px 56px;}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.pill{min-height:40px;padding:8px 18px;border-radius:999px;font-size:14.5px;font-weight:700;border:1.5px solid;border-color:#c4d6c2;color:#1e4d38;background:#f4f8f2;}
.pill[aria-pressed="true"]{background:#1e4d38;color:#fff;border-color:#1e4d38;}
.sortwrap{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:14.5px;font-weight:700;color:#1e4d38;}
.sortwrap select{min-height:40px;border-radius:999px;padding:6px 14px;font-size:14.5px;font-weight:700;background:#f4f8f2;border:1.5px solid #c4d6c2;color:#1e4d38;}
.count{font-size:14.5px;color:#64806b;font-weight:700;margin:18px 0 0;}
.grid{display:grid;gap:22px;grid-template-columns:repeat(3,1fr);margin-top:18px;}
.card{overflow:hidden;display:flex;flex-direction:column;background:#fbfdfb;border:1px solid #e2ecdf;border-radius:24px;box-shadow:0 10px 26px rgba(30,77,56,.07);}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:9px;flex:1;}
.card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.imgwrap{position:relative;overflow:hidden;background:#fff;aspect-ratio:1/1;}
.imgwrap img{width:100%;height:100%;object-fit:cover;}
.cat-badge{position:absolute;top:12px;left:12px;color:#fff;font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;letter-spacing:.04em;background:#5c8266;}
.cat-line{font-size:12px;font-weight:800;letter-spacing:.19em;text-transform:uppercase;color:#7d927f;}
.pname{font-size:18px;font-weight:700;line-height:1.35;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em;color:#1e4d38;}
.pitch{font-size:14.5px;line-height:1.5;margin:0;color:#4c6653;}
.points{margin:0;padding:0;list-style:none;}
.points li{font-size:13.5px;line-height:1.45;padding-left:16px;position:relative;margin-top:4px;color:#64806b;}
.points li::before{content:"";position:absolute;left:0;top:.52em;width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:inset 0 0 0 1.5px #5c8266;}
.price{font-weight:800;letter-spacing:-.01em;color:#1e4d38;font-size:28px;}
.cny{font-size:13.5px;color:#7d927f;font-weight:700;margin-left:8px;}
.card-btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;border:1.5px solid;border-color:#1e4d38;color:#1e4d38;background:#fff;}
.sc footer{background:var(--sage-soft);color:#1e4d38;padding:38px 28px;}
.foot-in{max-width:1300px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.foot-in .brandname{color:#1e4d38;font-size:23px;}
.foot-in .sp{flex:1;}
.foot-meta{font-size:13.5px;color:#4c6653;line-height:1.6;}
@media (max-width:1080px){.grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:760px){.sc .hero{grid-template-columns:1fr;padding:36px 24px;}.sortwrap{margin-left:0;}}
@media (max-width:520px){.grid{grid-template-columns:1fr;}}
